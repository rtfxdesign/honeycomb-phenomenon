<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Honeycomb submission</title></head>
  <body>
    <form name="honeycomb-experience" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="honeycomb-experience">
      <input name="bot-field">
      <input name="title">
      <input name="location">
      <input name="experienceYear">
      <input name="experienceType">
      <textarea name="transcript"></textarea>
      <input name="privacy">
      <input name="recordingMode">
      <input type="file" name="media">
      <input name="mediaKey">
    </form>
    <!-- Request Access, from the gate. Netlify emails each submission to Paul;
         "review" is a link that opens /review with the name and email filled in. -->
    <form name="request-access" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="request-access">
      <input name="bot-field">
      <input name="name">
      <input name="email" type="email">
      <input name="site">
      <input name="review">
    </form>
  </body>
</html>
